AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Rol que GitHub Actions asume para desplegar, mediante OpenID Connect.

  Evita guardar llaves de acceso permanentes en los secretos del repositorio:
  GitHub presenta un token firmado de cada ejecución y AWS entrega credenciales
  temporales solo si el token viene del repositorio y la rama esperados. No hay
  nada que rotar ni que se pueda filtrar.

Parameters:
  Repositorio:
    Type: String
    Default: ssalaza7/aprobaciones-firma-digital
    Description: Repositorio autorizado, en formato propietario/nombre.
  Rama:
    Type: String
    Default: main
    Description: Única rama desde la que se permite desplegar.

Resources:
  ProveedorGitHub:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # Huella del certificado de GitHub. AWS ya no la valida para este
      # proveedor, pero el recurso sigue exigiendo el campo.
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  RolDespliegue:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-aprobaciones
      Description: Despliegue del flujo de aprobaciones desde GitHub Actions
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ProveedorGitHub
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # La restricción de fondo va sobre estas dos reclamaciones, que
                # llegan siempre en formato estable: este repositorio y esta rama.
                token.actions.githubusercontent.com:repository: !Ref Repositorio
                token.actions.githubusercontent.com:ref: !Sub refs/heads/${Rama}
              StringLike:
                # IAM obliga además a condicionar sobre `sub`. GitHub lo emite
                # en dos formatos —por nombre, o inmutable con el id numérico
                # del propietario y del repositorio incrustado
                # (repo:usuario@49240031/repo@1315501885:...)—, así que se
                # contemplan ambos. Un nombre de usuario no puede contener "@",
                # de modo que el comodín no abre la puerta a otra cuenta.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${Repositorio}:*
                  - !Sub
                    - repo:${Propietario}@*/${Nombre}@*:*
                    - Propietario: !Select [0, !Split ['/', !Ref Repositorio]]
                      Nombre: !Select [1, !Split ['/', !Ref Repositorio]]
      Policies:
        - PolicyName: despliegue-serverless
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Permisos acotados a los servicios que el stack realmente usa,
              # en lugar de AdministratorAccess.
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - lambda:*
                  - apigateway:*
                  - dynamodb:*
                  - logs:*
                  - xray:*
                  - s3:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                # Solo puede administrar los roles que crea el propio stack.
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/aprobaciones-*

Outputs:
  ArnRol:
    Description: Valor de la variable AWS_ROLE_ARN del repositorio.
    Value: !GetAtt RolDespliegue.Arn
