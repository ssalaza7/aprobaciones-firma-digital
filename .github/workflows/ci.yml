name: CI

# Se ejecuta en cada push a las ramas permanentes de Gitflow y en cada pull
# request hacia ellas. Es la puerta que protege a `develop` y a `main`.
on:
  push:
    # En `main` no hace falta: el flujo de despliegue ya ejecuta este CI
    # completo como paso previo, y duplicarlo solo gasta minutos.
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # Permite que el flujo de despliegue lo reutilice como paso previo.
  workflow_call:

# Si se empuja dos veces seguidas a la misma rama, cancela la ejecución anterior:
# no tiene sentido gastar minutos validando un commit ya superado.
concurrency:
  # Incluye el nombre del flujo: al reutilizarse desde el CD, este grupo
  # pasa a ser "ci-CD-…" y no cancela una ejecución independiente del CI.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tipos, pruebas y cobertura
    runs-on: ubuntu-latest

    # DynamoDB Local como servicio: así las pruebas de integración del
    # adaptador se ejecutan de verdad en CI y no se omiten.
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports: ['8000:8000']

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Preparar la tabla de DynamoDB
        run: npm run tabla:local
        env:
          DYNAMO_ENDPOINT: http://localhost:8000
          AWS_REGION: us-east-1

      - name: Pruebas con cobertura
        # El umbral vive en jest.config.js: 60 % global y 90 % en dominio y
        # aplicación. Si la cobertura baja, este paso falla solo.
        run: npm run test:cobertura
        env:
          DYNAMO_ENDPOINT: http://localhost:8000
          TABLA_DYNAMO: aprobaciones
          AWS_REGION: us-east-1

      - name: Compilar
        run: npm run build

      - name: Publicar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/
          retention-days: 7

  frontend:
    name: Frontend · tipos, pruebas y build de los microfrontends
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas con cobertura
        run: npm run test:cobertura

      - name: Compilar host y remotos
        # Comprueba que los tres bundles de Module Federation se generan; un
        # error de configuración del host o de un remoto se ve aquí.
        run: npm run build

      - name: Publicar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          retention-days: 7

  infraestructura:
    name: Infraestructura · validación de la plantilla SAM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validar la plantilla
        # Solo comprueba sintaxis y reglas de linting, pero SAM CLI exige una
        # sesión de AWS resoluble: se le dan credenciales ficticias porque
        # nunca llega a llamar a la nube.
        run: sam validate --template infra/template.yaml --lint --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ficticia
          AWS_SECRET_ACCESS_KEY: ficticia
          AWS_DEFAULT_REGION: us-east-1
