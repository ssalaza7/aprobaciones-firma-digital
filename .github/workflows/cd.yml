name: CD

# Despliega solo desde `main`, que en Gitflow es la rama de producción: lo que
# llega ahí ya pasó por `develop`, por una rama de release y por el CI.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos despliegues a la vez sobre el mismo entorno.
concurrency:
  group: cd-produccion
  cancel-in-progress: false

permissions:
  # Necesario para que GitHub emita el token OIDC con el que se asume el rol.
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ETAPA: dev
  STACK_API: aprobaciones-firma-digital
  STACK_FRONTEND: aprobaciones-frontend

jobs:
  verificar:
    name: Verificar antes de desplegar
    uses: ./.github/workflows/ci.yml

  desplegar:
    name: Desplegar en AWS
    needs: verificar
    runs-on: ubuntu-latest
    environment: produccion

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Obtener credenciales temporales por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # El ARN del rol es una variable del repositorio, no un secreto: no
          # sirve de nada sin un token OIDC de este repositorio y esta rama.
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: despliegue-${{ github.run_id }}

      - name: Desplegar la API
        working-directory: infra
        run: |
          sam build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Leer las URL de los stacks
        id: urls
        run: |
          API=$(aws cloudformation describe-stacks --stack-name "$STACK_API" \
            --query "Stacks[0].Outputs[?OutputKey=='UrlApi'].OutputValue" --output text)
          WEB=$(aws cloudformation describe-stacks --stack-name "$STACK_FRONTEND" \
            --query "Stacks[0].Outputs[?OutputKey=='UrlFrontend'].OutputValue" --output text)
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_FRONTEND" \
            --query "Stacks[0].Outputs[?OutputKey=='NombreBucketFrontend'].OutputValue" --output text)
          echo "api=$API"       >> "$GITHUB_OUTPUT"
          echo "web=$WEB"       >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Compilar los microfrontends contra la API desplegada
        working-directory: frontend
        env:
          API_URL: ${{ steps.urls.outputs.api }}
          URL_MF_SOLICITANTE: ${{ steps.urls.outputs.web }}/solicitante
          URL_MF_APROBADOR: ${{ steps.urls.outputs.web }}/aprobador
        run: |
          npm ci
          npm run build

      - name: Publicar el frontend
        working-directory: frontend
        env:
          BUCKET: ${{ steps.urls.outputs.bucket }}
        run: |
          aws s3 sync packages/host/dist           "s3://$BUCKET/"             --delete --exclude "solicitante/*" --exclude "aprobador/*"
          aws s3 sync packages/mf-solicitante/dist "s3://$BUCKET/solicitante/" --delete
          aws s3 sync packages/mf-aprobador/dist   "s3://$BUCKET/aprobador/"   --delete

      - name: Comprobar que lo desplegado responde
        env:
          API: ${{ steps.urls.outputs.api }}
          WEB: ${{ steps.urls.outputs.web }}
        run: |
          set -e
          echo "Comprobando $API/api/salud"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/salud")" = "200"
          echo "Comprobando $WEB"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$WEB/")" = "200"

      - name: Resumen del despliegue
        env:
          API: ${{ steps.urls.outputs.api }}
          WEB: ${{ steps.urls.outputs.web }}
        run: |
          {
            echo "### Despliegue completado"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Aplicación | $WEB |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "Verificado: la API responde y el frontend se sirve."
          } >> "$GITHUB_STEP_SUMMARY"
